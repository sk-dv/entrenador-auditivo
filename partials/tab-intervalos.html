<div class="tab-panel" id="tab-intervalos">

    <div class="tab-intro">
        <div class="tab-intro-title">Quiz de intervalos</div>
        <div class="tab-intro-desc">La app genera 10 intervalos al azar. Activá los que querés incluir en el sorteo, elegí la dirección y presioná <strong>▶</strong>.</div>
    </div>

    <span class="sec-label">Incluir en el sorteo</span>
    <div class="int-picker" id="intPicker"></div>

    <div class="mode-row" style="margin-bottom:1.75rem">
        <span class="mode-label">dirección:</span>
        <button class="mode-btn int-dir-btn m-active" onclick="setIntDirection('asc',this)">↑ ascendente</button>
        <button class="mode-btn int-dir-btn" onclick="setIntDirection('desc',this)">↓ descendente</button>
        <button class="mode-btn int-dir-btn" onclick="setIntDirection('simul',this)">■ simultáneo</button>
    </div>

    <!-- Slots -->
    <div class="seq-slots-area" id="intSlotsArea" style="display:none">
        <div class="seq-slots-hint" id="intQuizHint">intervalo 1 de 10</div>
        <div class="seq-slots" id="intSeqSlots"></div>
    </div>

    <div class="quiz-area">
        <div class="play-zone">
            <button class="big-play-btn" id="intPlayBtn" onclick="intAction()">▶</button>
            <div class="play-hint" id="intPlayHint">toca para comenzar</div>
            <button class="repeat-btn" id="intRepeatBtn" onclick="intPlayCurrent()" disabled>↺ repetir</button>
        </div>

        <div class="deg-btn-grid" id="intAnswerBtns"></div>

        <div class="reveal-panel" id="intRevealPanel">
            <div class="rev-name" id="intRevScore">—</div>
            <div class="rev-sub" id="intRevMsg">—</div>
            <div class="seq-reveal-list" id="intRevealList"></div>
            <button class="next-btn" onclick="startIntTest()">→ nueva ronda</button>
        </div>
    </div>

    <div class="score-bar">
        <div class="score-part">
            <div class="score-label">Ronda</div>
            <div class="score-val" id="intRound">—</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-part">
            <div class="score-label">Acumulado</div>
            <div class="score-val" id="intScore">0/0</div>
        </div>
        <div class="score-divider"></div>
        <div class="score-part">
            <div id="racha-intervalos"></div>
            <div id="hist-intervalos"></div>
        </div>
    </div>

    <div class="adap-panel">
        <div class="sec-label">Progreso por intervalo</div>
        <div id="intProgBars"></div>
        <div class="adap-focus" id="intFocusHint"></div>
    </div>

</div>
