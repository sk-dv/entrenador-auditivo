<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oído Armónico — Inversiones</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <meta name="theme-color" content="#1a1714">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Oído">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/grados.css">
    <link rel="stylesheet" href="css/armonia.css">
    <link rel="stylesheet" href="css/dictado-intervalos.css">
    <link rel="stylesheet" href="css/editorial.css">
    <link rel="modulepreload" href="js/audio-engine.js">
    <link rel="modulepreload" href="https://esm.sh/superdough@1.3.0">
</head>

<body>
    <div class="wrap">

        <header>
            <div class="header-brand">
                <div class="eyebrow">Entrenamiento auditivo</div>
                <h1>Oído Armónico</h1>
            </div>
            <div class="header-controls">
                <div class="vol-popover" id="volPopover">
                    <button class="header-icon-btn" onclick="document.getElementById('volPopover').classList.toggle('open')" title="Volumen">♪</button>
                    <div class="vol-popup" id="volPopup">
                        <span class="vol-label">vol</span>
                        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8"
                               oninput="setMasterVolume(this.value)">
                        <span class="vol-value" id="volValue">80%</span>
                    </div>
                </div>
                <button class="header-icon-btn" onclick="document.getElementById('volPopover').classList.remove('open'); openAnalysis()" title="Análisis de progreso">📊</button>
                <div class="auth-control">
                    <img id="authAvatar" class="auth-avatar" src="" alt="" style="display:none">
                    <span id="authUser" class="auth-user"></span>
                    <button id="syncCustomBtn" class="auth-btn" style="display:none" onclick="window.FB && window.FB.syncCustomNow()" title="Subir progresiones y secuencias propias a la nube">↑ sync</button>
                    <button id="authBtn" class="auth-btn" onclick="window.FB && window.FB.toggle()">Iniciar sesión</button>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('aprender')">
                <span class="tab-icon">♩</span>
                <span class="tab-label">Aprender</span>
            </button>
            <button class="tab-btn" onclick="switchTab('explorar')">
                <span class="tab-icon">♬</span>
                <span class="tab-label">Explorar</span>
            </button>
            <button class="tab-btn" onclick="switchTab('practicar')">
                <span class="tab-icon">♯</span>
                <span class="tab-label">Acordes</span>
            </button>
            <button class="tab-btn" onclick="switchTab('grados')">
                <span class="tab-icon">♭</span>
                <span class="tab-label">Grados</span>
            </button>
            <button class="tab-btn" onclick="switchTab('dictado')">
                <span class="tab-icon">♫</span>
                <span class="tab-label">Dictado</span>
            </button>
            <button class="tab-btn" onclick="switchTab('intervalos')">
                <span class="tab-icon">♮</span>
                <span class="tab-label">Intervalos</span>
            </button>
        </div>

        <!-- ══════════════════════════════════════════
     TAB 1 — APRENDER
══════════════════════════════════════════ -->
        <div data-partial="partials/tab-aprender.html"></div>

        <!-- ══════════════════════════════════════════
     TAB 2 — EXPLORAR
══════════════════════════════════════════ -->
        <div data-partial="partials/tab-explorar.html"></div>

        <!-- ══════════════════════════════════════════
     TAB 3 — PRACTICAR
══════════════════════════════════════════ -->
        <div data-partial="partials/tab-practicar.html"></div>

        <!-- ══════════════════════════════════════════
     TAB 4 — GRADOS TONALES
══════════════════════════════════════════ -->
        <div data-partial="partials/tab-grados.html"></div>

        <!-- ══════════════════════════════════════════
     TAB 5 — DICTADO ISÓCRONO
══════════════════════════════════════════ -->
        <div data-partial="partials/tab-dictado.html"></div>

        <!-- ══════════════════════════════════════════
     TAB 6 — INTERVALOS
══════════════════════════════════════════ -->
        <div data-partial="partials/tab-intervalos.html"></div>

    </div><!-- end .wrap -->

    <!-- Modal de detalle de acorde (Explorer) -->
    <div data-partial="partials/modal-acorde.html"></div>


    <!-- Modal de análisis -->
    <div data-partial="partials/modal-analisis.html"></div>

    <!-- Banner de actualización PWA -->
    <div data-partial="partials/pwa-banner.html"></div>

    <!-- Motor de audio (superdough vía ESM/CDN). Defer por ser type=module;
         js/audio.js delega aquí en runtime, no en parse-time. -->
    <script type="module" src="js/audio-engine.js"></script>

    <!-- Módulos JS (definen funciones/datos; no tocan el DOM al cargar) -->
    <script src="js/audio.js"></script>
    <script src="js/acordes-explorer.js"></script>
    <script src="js/quiz-inversiones.js"></script>
    <script src="js/datos-armonia.js"></script>
    <script src="js/progresivo.js"></script>
    <script src="js/custom-progs.js"></script>
    <script src="js/quiz-armonia.js"></script>
    <script src="js/progreso.js"></script>
    <script src="js/dictado.js"></script>
    <script src="js/analisis-posicion.js"></script>
    <script src="js/secuencias.js"></script>
    <script src="js/intervalos.js"></script>
    <script src="js/init.js"></script>
    <script src="js/ui-handlers.js"></script>
    <!-- bootstrap inyecta los partials y luego llama a initApp() -->
    <script src="js/bootstrap.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="firebase.js"></script>
</body>

</html>
